<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storythread — UI/UX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=DM+Sans:opsz,wght@9..40,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#f0eee9; font-family:"DM Sans", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="screens-onboarding.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-parent.jsx"></script>
<script type="text/babel" src="screens-teen.jsx"></script>
<script type="text/babel" src="screens-reading.jsx"></script>
<script type="text/babel" src="screens-reading-v2.jsx"></script>
<script type="text/babel" src="screens-system.jsx"></script>

<script type="text/babel">
const PHONE_W = 410;
const PHONE_H = 870;

function App() {
  return (
    <DesignCanvas>

      {/* INTRO POSTER */}
      <DCSection id="intro" title="Storythread"
        subtitle="A PWA that writes personalized bedtime stories for teens — privately, for tonight.">
        <DCArtboard id="cover" label="Cover" width={680} height={520}>
          <Cover/>
        </DCArtboard>
      </DCSection>

      {/* ONBOARDING */}
      <DCSection id="onboarding" title="01 · Onboarding"
        subtitle="Three steps: a single warm welcome, the people the stories will hold, and where the writing comes from.">
        <DCArtboard id="onb-1" label="Welcome"           width={PHONE_W} height={PHONE_H}><OnbWelcome/></DCArtboard>
        <DCArtboard id="onb-2" label="Profile + Friends" width={PHONE_W} height={PHONE_H}><OnbProfile/></DCArtboard>
        <DCArtboard id="onb-3" label="Story engine"      width={PHONE_W} height={PHONE_H}><OnbLLM/></DCArtboard>
      </DCSection>

      {/* HOME + SETTINGS */}
      <DCSection id="home" title="02 · Home + Settings"
        subtitle="Two unambiguous entry points. Recent stories below, never gamified.">
        <DCArtboard id="home" label="Home" width={PHONE_W} height={PHONE_H}><ScreenHome/></DCArtboard>
        <DCArtboard id="settings" label="Settings · one-time setup, surfaced once" width={PHONE_W} height={PHONE_H}><ScreenSettings/></DCArtboard>
      </DCSection>

      {/* PARENT INTERVIEW */}
      <DCSection id="parent" title="03 · Parent Mode · 9pm interview"
        subtitle="Four short questions. Freeform, then friend chips, then emotion chips, then a destination. Designed for a tired adult holding a phone with one hand.">
        <DCArtboard id="p-q1" label="Q1 · The moment"        width={PHONE_W} height={PHONE_H}><ParentQ1/></DCArtboard>
        <DCArtboard id="p-q2" label="Q2 · Who was there"     width={PHONE_W} height={PHONE_H}><ParentQ2/></DCArtboard>
        <DCArtboard id="p-q3" label="Q3 · How she carried it"width={PHONE_W} height={PHONE_H}><ParentQ3/></DCArtboard>
        <DCArtboard id="p-q4" label="Q4 · Emotional destination" width={PHONE_W} height={PHONE_H}><ParentQ4/></DCArtboard>
      </DCSection>

      {/* TEEN + LOADING */}
      <DCSection id="teen" title="04 · Teen Mode + Generation"
        subtitle="Eight curated themes. No freeform input for the teen. Then a slow, warm wait — not a spinner.">
        <DCArtboard id="teen-themes" label="Theme picker · 8 cards" width={PHONE_W} height={PHONE_H}><TeenThemes/></DCArtboard>
        <DCArtboard id="loading" label="Generating · the slow breath" width={PHONE_W} height={PHONE_H}><StoryLoading/></DCArtboard>
      </DCSection>

      {/* READING VIEW */}
      <DCSection id="reading" title="05 · Reading view"
        subtitle="The story is the product. Two layouts, two themes, one type sheet. Dark is the default at night.">
        <DCArtboard id="r-dark"      label="Typography-led · Midnight" width={PHONE_W} height={PHONE_H}><ReadingDark/></DCArtboard>
        <DCArtboard id="r-light"     label="Typography-led · Cream"    width={PHONE_W} height={PHONE_H}><ReadingLight/></DCArtboard>
        <DCArtboard id="r-controls"  label="Type sheet · open"         width={PHONE_W} height={PHONE_H}><ReadingWithControls/></DCArtboard>
        <DCArtboard id="r-imm-dark"  label="Immersive · scene + card · Midnight" width={PHONE_W} height={PHONE_H}><ReadingImmersiveDark/></DCArtboard>
        <DCArtboard id="r-imm-light" label="Immersive · scene + card · Cream"    width={PHONE_W} height={PHONE_H}><ReadingImmersiveLight/></DCArtboard>
        <DCArtboard id="r-after"     label="After the story · private check-in"  width={PHONE_W} height={PHONE_H}><AfterStory/></DCArtboard>
      </DCSection>

      {/* DESIGN SYSTEM */}
      <DCSection id="system" title="06 · Design system foundations"
        subtitle="The tokens, type, components, and the principles we promise not to break.">
        <DCArtboard id="ds-color"  label="Colour tokens"  width={440} height={620}><ColorTokensCard/></DCArtboard>
        <DCArtboard id="ds-type"   label="Typography"     width={460} height={620}><TypeCard/></DCArtboard>
        <DCArtboard id="ds-space"  label="Spacing · radii · elevation" width={440} height={520}><SpacingCard/></DCArtboard>
        <DCArtboard id="ds-comp"   label="Components"     width={460} height={620}><ComponentsCard/></DCArtboard>
        <DCArtboard id="ds-prin"   label="3 things we won't break"      width={520} height={500}><PrinciplesCard/></DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

function Cover() {
  return (
    <div style={{
      width:'100%', height:'100%', borderRadius:20, overflow:'hidden',
      background:`linear-gradient(155deg, #2c3158 0%, #15182a 60%, #0c0e18 100%)`,
      padding:'40px 44px', boxSizing:'border-box', color:ST.paperD,
      fontFamily:FONT_SANS, position:'relative',
    }}>
      <div style={{ position:'absolute', right:-40, top:-40, opacity:0.18 }}>
        <Icon name="moon" size={320} color={ST.amberSoft}/>
      </div>
      <div style={{ position:'relative', maxWidth:520 }}>
        <div style={{
          fontFamily:FONT_MONO, fontSize:11, letterSpacing:'.24em',
          textTransform:'uppercase', color:ST.amberSoft, marginBottom:18,
        }}>Storythread · PWA · Ages 10–16</div>
        <div style={{
          fontFamily:FONT_SERIF, fontSize:64, lineHeight:1.02, letterSpacing:'-0.025em',
          color:ST.paperD,
        }}>
          A bedtime story,<br/>
          <span style={{ fontStyle:'italic', color:ST.amberSoft }}>quietly shaped<br/>around the day they had.</span>
        </div>
        <div style={{
          fontFamily:FONT_SERIF, fontSize:18, color:ST.paperD70, marginTop:24,
          lineHeight:1.55, maxWidth:460, textWrap:'pretty',
        }}>
          Two voices. One for the parent at 9pm — four questions about the day, no freeform from the child. One for the teen — a small menu of feelings, names and friends already known. The story is generated, read by lamplight, and forgotten.
        </div>
        <div style={{
          display:'flex', gap:14, marginTop:30,
          fontFamily:FONT_MONO, fontSize:11, color:ST.paperD70, letterSpacing:'.12em',
          textTransform:'uppercase',
        }}>
          <span>Mobile-first 390×844</span>
          <span style={{ color:ST.paperD30 }}>·</span>
          <span>Local-first</span>
          <span style={{ color:ST.paperD30 }}>·</span>
          <span>No gamification</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
